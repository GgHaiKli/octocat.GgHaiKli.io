<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>月与雨 · 澜洲纪行</title>
<style>
:root{
  --bg:#0c0f14; --panel:#131820; --panel2:#1a212b; --border:#242c38;
  --text:#dde3ec; --muted:#78828f; --accent:#7aa2f7; --accent-dim:#3d5a8a;
  --rain:#6fd3c7; --danger:#f7768e; --gold:#e0af68;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  font-size:15px;line-height:1.8;
}
button{
  font-family:inherit;font-size:13px;cursor:pointer;
  background:var(--panel2);color:var(--text);
  border:1px solid var(--border);border-radius:6px;
  padding:7px 14px;transition:.15s;
}
button:hover{background:#212936;border-color:#39424f}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:var(--accent-dim);border-color:var(--accent);color:#e8f0ff}
button.primary:hover{background:#4a6ba5}
button.ghost{background:transparent}
input,textarea,select{
  font-family:inherit;font-size:13px;
  background:#0a0d12;color:var(--text);
  border:1px solid var(--border);border-radius:6px;
  padding:8px 10px;width:100%;outline:none;
}
input:focus,textarea:focus{border-color:var(--accent-dim)}
textarea{resize:vertical;line-height:1.7}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2a3340;border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:#3a4655}

/* ── 顶栏 ── */
header{
  height:52px;display:flex;align-items:center;gap:14px;
  padding:0 18px;border-bottom:1px solid var(--border);
  background:linear-gradient(180deg,#111722,#0d1117);
  flex-shrink:0;
}
.logo{font-size:16px;font-weight:600;letter-spacing:1px}
.logo .moon{color:var(--accent)}
.logo .sub{font-size:11px;color:var(--muted);letter-spacing:2px;margin-left:8px}
header .spacer{flex:1}
header button{padding:6px 12px;font-size:12px}

/* ── 布局 ── */
#app{display:flex;flex-direction:column;height:100%}
#body{flex:1;display:flex;min-height:0}

/* ── 设置页 ── */
#setup{
  flex:1;overflow-y:auto;padding:34px 24px 80px;
  display:flex;justify-content:center;
}
.setup-inner{width:100%;max-width:820px}
.setup-title{font-size:22px;font-weight:600;margin-bottom:6px}
.setup-desc{color:var(--muted);font-size:13px;margin-bottom:28px;line-height:1.9}
.section{margin-bottom:26px}
.section-h{
  font-size:12px;letter-spacing:2px;color:var(--accent);
  margin-bottom:10px;display:flex;align-items:center;gap:8px;
}
.section-h::after{content:"";flex:1;height:1px;background:var(--border)}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
.row{display:flex;gap:12px}
.row>*{flex:1}
.hint{font-size:11px;color:#5a6472;margin-top:5px;line-height:1.7}

/* ── 阅读页 ── */
#reader{flex:1;display:none;min-height:0}
#sidebar{
  width:216px;flex-shrink:0;border-right:1px solid var(--border);
  background:var(--panel);overflow-y:auto;padding:14px 10px;
}
.side-label{font-size:11px;letter-spacing:2px;color:var(--muted);padding:0 8px 10px}
.ch-item{
  padding:9px 10px;border-radius:6px;font-size:13px;color:#9aa4b2;
  cursor:pointer;margin-bottom:3px;line-height:1.5;
  border-left:2px solid transparent;transition:.15s;
}
.ch-item:hover{background:var(--panel2);color:var(--text)}
.ch-item.active{background:var(--panel2);color:var(--text);border-left-color:var(--accent)}
.ch-item .num{font-size:11px;color:var(--muted);margin-right:6px}

#content{flex:1;display:flex;flex-direction:column;min-width:0}
#story{
  flex:1;overflow-y:auto;padding:38px 0 30px;
}
.story-inner{max-width:720px;margin:0 auto;padding:0 30px}
.ch-title{
  font-size:20px;font-weight:600;margin-bottom:26px;
  color:#eaf0fa;letter-spacing:.5px;
  padding-bottom:14px;border-bottom:1px solid var(--border);
}
.prose{font-size:15.5px;line-height:2.05;color:#cdd5e0}
.prose p{margin-bottom:1.15em;text-indent:2em}
.prose h3{font-size:16px;margin:1.6em 0 .8em;color:#e6ecf6;text-indent:0}
.prose em{color:var(--rain);font-style:normal}

.choice-echo{
  margin:26px 0;padding:12px 16px;border-left:2px solid var(--gold);
  background:#161c14;border-radius:0 6px 6px 0;
  font-size:13px;color:#b8c0cc;
}
.choice-echo .lbl{font-size:11px;color:var(--gold);letter-spacing:1px;display:block;margin-bottom:4px}

/* ── 选项区 ── */
#actions{
  flex-shrink:0;border-top:1px solid var(--border);
  background:var(--panel);padding:16px 30px 18px;
  max-height:46vh;overflow-y:auto;
}
.actions-inner{max-width:720px;margin:0 auto}
.act-label{font-size:11px;letter-spacing:2px;color:var(--muted);margin-bottom:10px}
.opt{
  display:block;width:100%;text-align:left;
  background:var(--panel2);border:1px solid var(--border);
  border-radius:8px;padding:11px 15px;margin-bottom:8px;
  font-size:13.5px;line-height:1.7;color:#c4cdda;
  transition:.15s;
}
.opt:hover{background:#1f2733;border-color:var(--accent-dim);color:#e8eef8;transform:translateX(2px)}
.opt .k{color:var(--accent);font-weight:600;margin-right:8px}
.free-row{display:flex;gap:8px;margin-top:12px}
.free-row input{flex:1}
.free-row button{flex-shrink:0;padding:8px 16px}

/* ── 生成中 ── */
.typing{
  display:inline-block;width:7px;height:15px;background:var(--accent);
  animation:blink .9s step-end infinite;vertical-align:-2px;margin-left:3px;
}
@keyframes blink{50%{opacity:0}}

.err{
  background:#2a1519;border:1px solid #5c2b34;color:#f0a0ab;
  padding:12px 15px;border-radius:8px;font-size:13px;margin:20px 0;
  white-space:pre-wrap;line-height:1.7;
}

#toast{
  position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);
  background:#1c2531;border:1px solid var(--border);color:var(--text);
  padding:9px 20px;border-radius:20px;font-size:13px;
  opacity:0;pointer-events:none;transition:.25s;z-index:99;
}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:820px){
  #sidebar{display:none}
  .story-inner,#actions{padding-left:18px;padding-right:18px}
  header{padding:0 12px}
  .logo .sub{display:none}
}
</style>
</head>
<body>
<div id="app">

<header>
  <div class="logo"><span class="moon">月</span>与雨<span class="sub">澜洲纪行</span></div>
  <div class="spacer"></div>
  <button id="btnSetup" class="ghost">设定</button>
  <button id="btnExport" class="ghost">导出</button>
  <button id="btnReset" class="ghost">重开</button>
</header>

<div id="body">

  <!-- ═══ 设置页 ═══ -->
  <div id="setup">
    <div class="setup-inner">
      <div class="setup-title">开篇设定</div>
      <div class="setup-desc">
        先配置 API，再确认世界观与主人公。生成时，系统会把这里的设定作为系统提示，逐章推进剧情。
      </div>

      <div class="section">
        <div class="section-h">API 配置</div>
        <div class="field">
          <label>接口地址（兼容 OpenAI 格式）</label>
          <input id="cfgBase" placeholder="https://api.openai.com/v1">
          <div class="hint">可填 https://api.deepseek.com/v1、https://api.moonshot.cn/v1 等，末尾带不带 /chat/completions 都行。</div>
        </div>
        <div class="row">
          <div class="field">
            <label>模型名</label>
            <input id="cfgModel" placeholder="gpt-4o">
          </div>
          <div class="field">
            <label>API Key</label>
            <input id="cfgKey" type="password" placeholder="sk-...">
          </div>
        </div>
        <div class="row">
          <div class="field">
            <label>温度</label>
            <input id="cfgTemp" type="number" step="0.05" min="0" max="2">
          </div>
          <div class="field">
            <label>单章最大 token</label>
            <input id="cfgMax" type="number" step="500" min="1000">
          </div>
        </div>
      </div>

      <div class="section">
        <div class="section-h">故事预设</div>
        <div class="field">
          <label>世界观 / 地区制度</label>
          <textarea id="psWorld" rows="9"></textarea>
        </div>
        <div class="field">
          <label>主人公</label>
          <textarea id="psProt" rows="9"></textarea>
        </div>
        <div class="field">
          <label>队伍（按剧情逐步加入）</label>
          <textarea id="psTeam" rows="9"></textarea>
        </div>
        <div class="field">
          <label>全局大纲</label>
          <textarea id="psOutline" rows="8"></textarea>
        </div>
        <div class="field">
          <label>写作规则</label>
          <textarea id="psRules" rows="7"></textarea>
        </div>
        <div class="field">
          <label>文风要求</label>
          <textarea id="psStyle" rows="6"></textarea>
        </div>
        <div class="field">
          <label>开篇起点</label>
          <textarea id="psOpening" rows="2"></textarea>
        </div>
        <div class="row" style="margin-top:14px">
          <button id="btnImport">导入预设 JSON</button>
          <button id="btnSaveSetup" class="primary">保存设定</button>
        </div>
        <input id="fileImport" type="file" accept=".json" style="display:none">
      </div>
    </div>
  </div>

  <!-- ═══ 阅读页 ═══ -->
  <div id="reader">
    <div id="sidebar">
      <div class="side-label">章节</div>
      <div id="chList"></div>
    </div>
    <div id="content">
      <div id="story"><div class="story-inner" id="storyInner"></div></div>
      <div id="actions"><div class="actions-inner" id="actionsInner"></div></div>
    </div>
  </div>

</div>
</div>
<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const OPT_RE = /[=＝]{2,}\s*选项\s*[=＝]{2,}/;
const SUM_RE = /[=＝]{2,}\s*摘要\s*[=＝]{2,}/;

let STATE = { config:{}, preset:{}, chapters:[] };
let busy = false;
let currentView = -1;   // -1 表示看最新

/* ────────── 工具 ────────── */
function toast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('on'), 2200);
}

function esc(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderProse(text){
  let s = esc(text);
  s = s.replace(/^(#{1,4})\s*(.+)$/gm, (m,h,t)=>`<h3>${t}</h3>`);
  const blocks = s.split(/\n{2,}/);
  return blocks.map(b=>{
    b = b.trim();
    if(!b) return '';
    if(b.startsWith('<h3>')) return b;
    return '<p>' + b.replace(/\n/g,'<br>') + '</p>';
  }).join('');
}

async function api(path, body){
  const opt = body
    ? { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) }
    : {};
  const r = await fetch(path, opt);
  return r.json();
}

/* ────────── 加载 / 保存 ────────── */
async function loadState(){
  STATE = await api('/api/state');
  fillSetup();
  renderAll();
}

function fillSetup(){
  const c = STATE.config, p = STATE.preset;
  $('#cfgBase').value  = c.base_url || '';
  $('#cfgModel').value = c.model || '';
  $('#cfgKey').value   = c.api_key || '';
  $('#cfgTemp').value  = c.temperature ?? 0.9;
  $('#cfgMax').value   = c.max_tokens ?? 8000;

  $('#psWorld').value   = p.world || '';
  $('#psProt').value    = p.protagonist || '';
  $('#psTeam').value    = p.team || '';
  $('#psOutline').value = p.outline || '';
  $('#psRules').value   = p.rules || '';
  $('#psStyle').value   = p.style || '';
  $('#psOpening').value = p.opening || '';
}

async function saveSetup(){
  STATE.config = {
    base_url: $('#cfgBase').value.trim(),
    model: $('#cfgModel').value.trim(),
    api_key: $('#cfgKey').value.trim(),
    temperature: parseFloat($('#cfgTemp').value) || 0.9,
    max_tokens: parseInt($('#cfgMax').value) || 8000,
  };
  STATE.preset = {
    world: $('#psWorld').value,
    protagonist: $('#psProt').value,
    team: $('#psTeam').value,
    outline: $('#psOutline').value,
    rules: $('#psRules').value,
    style: $('#psStyle').value,
    opening: $('#psOpening').value,
  };
  await api('/api/save', { config: STATE.config, preset: STATE.preset });
  toast('设定已保存');
}

/* ────────── 视图 ────────── */
function showSetup(){
  $('#setup').style.display = 'flex';
  $('#reader').style.display = 'none';
}
function showReader(){
  $('#setup').style.display = 'none';
  $('#reader').style.display = 'flex';
}

function renderAll(){
  renderSidebar();
  if(STATE.chapters.length === 0){
    showSetup();
  } else {
    showReader();
    renderView(currentView);
  }
}

function renderSidebar(){
  const list = $('#chList');
  list.innerHTML = '';
  STATE.chapters.forEach((ch,i)=>{
    const d = document.createElement('div');
    d.className = 'ch-item' + (i === currentView || (currentView===-1 && i===STATE.chapters.length-1) ? ' active' : '');
    d.innerHTML = `<span class="num">${String(i+1).padStart(2,'0')}</span>${esc(ch.title || ('第'+(i+1)+'章'))}`;
    d.onclick = ()=>{ currentView = i; renderAll(); };
    list.appendChild(d);
  });
}

function renderView(idx){
  if(STATE.chapters.length === 0) return;
  if(idx < 0 || idx >= STATE.chapters.length) idx = STATE.chapters.length - 1;
  currentView = idx;
  const ch = STATE.chapters[idx];

  let html = '';
  if(ch.choice){
    html += `<div class="choice-echo"><span class="lbl">你的选择</span>${esc(ch.choice)}</div>`;
  }
  html += `<div class="ch-title">${esc(ch.title || ('第'+(idx+1)+'章'))}</div>`;
  html += `<div class="prose">${renderProse(ch.content || '')}</div>`;
  $('#storyInner').innerHTML = html;

  renderActions(idx);
  renderSidebar();
  $('#story').scrollTop = 0;
}

function renderActions(idx){
  const box = $('#actionsInner');
  const isLast = (idx === STATE.chapters.length - 1);
  const ch = STATE.chapters[idx];

  if(!isLast){
    box.innerHTML = `<div class="act-label">历史章节</div>
      <button class="opt" onclick="jumpLast()"><span class="k">→</span>回到最新一章</button>`;
    return;
  }

  if(busy) return;

  let html = '<div class="act-label">下一步</div>';
  const opts = ch.options || [];
  if(opts.length){
    opts.forEach((o,i)=>{
      const k = String.fromCharCode(65+i);
      html += `<button class="opt" data-choice="${esc(o)}"><span class="k">${k}.</span>${esc(o)}</button>`;
    });
  } else {
    html += `<div class="hint" style="margin-bottom:10px">上一章没有生成选项，你可以直接输入走向。</div>`;
  }
  html += `<div class="free-row">
      <input id="freeInput" placeholder="或者，自己写一个走向……">
      <button class="primary" id="btnFree">推进</button>
    </div>`;

  box.innerHTML = html;

  box.querySelectorAll('.opt[data-choice]').forEach(b=>{
    b.onclick = ()=> generate(b.dataset.choice);
  });
  const fi = $('#freeInput');
  $('#btnFree').onclick = ()=>{
    const v = fi.value.trim();
    if(!v) return;
    generate(v);
  };
  fi.onkeydown = e=>{ if(e.key === 'Enter') $('#btnFree').click(); };
}

window.jumpLast = ()=>{ currentView = STATE.chapters.length - 1; renderAll(); };

/* ────────── 生成 ────────── */
async function generate(choice){
  if(busy) return;
  busy = true;

  const box = $('#actionsInner');
  box.innerHTML = `<div class="act-label">正在写作</div>
    <div class="hint">模型正在生成下一章，请稍候……</div>`;

  // 先把占位章节推入视图
  const placeholder = {
    index: STATE.chapters.length + 1,
    title: '第' + (STATE.chapters.length + 1) + '章',
    content: '',
    options: [],
    summary: '',
    choice: choice,
  };
  STATE.chapters.push(placeholder);
  currentView = -1;
  renderSidebar();

  const storyInner = $('#storyInner');
  let full = '';
  let rendered = 0;

  function paint(){
    const m = full.search(OPT_RE);
    const visible = m >= 0 ? full.slice(0, m) : full;
    const titleMatch = visible.match(/^#{1,4}\s*(.+)$/m);
    const title = titleMatch ? titleMatch[1].trim() : placeholder.title;
    const bodyText = titleMatch ? visible.replace(/^#{1,4}\s*.+$/m, '') : visible;

    let html = '';
    if(choice){
      html += `<div class="choice-echo"><span class="lbl">你的选择</span>${esc(choice)}</div>`;
    }
    html += `<div class="ch-title">${esc(title)}</div>`;
    html += `<div class="prose">${renderProse(bodyText)}<span class="typing"></span></div>`;
    storyInner.innerHTML = html;

    if(full.length - rendered > 400){
      rendered = full.length;
      $('#story').scrollTop = $('#story').scrollHeight;
    }
    placeholder.title = title;
    placeholder.content = bodyText;
  }

  try{
    const resp = await fetch('/api/generate', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ choice })
    });

    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = '';

    while(true){
      const { done, value } = await reader.read();
      if(done) break;
      buf += dec.decode(value, { stream:true });

      const parts = buf.split('\n\n');
      buf = parts.pop();

      for(const p of parts){
        if(!p.startsWith('data: ')) continue;
        let obj;
        try{ obj = JSON.parse(p.slice(6)); }catch(e){ continue; }

        if(obj.type === 'chunk'){
          full += obj.text;
          paint();
        } else if(obj.type === 'done'){
          placeholder.title   = obj.chapter.title;
          placeholder.content = obj.chapter.content;
          placeholder.options = obj.chapter.options;
          placeholder.summary = obj.chapter.summary;
          placeholder.index   = obj.chapter.index;
        } else if(obj.type === 'error'){
          throw new Error(obj.message);
        }
      }
    }

    // 收尾解析（防止后端没解析干净）
    const m = full.search(OPT_RE);
    if(m >= 0){
      placeholder.content = full.slice(0, m).replace(/^#{1,4}\s*.+$/m,'').trim();
    }

    $('#story').scrollTop = $('#story').scrollHeight;
    busy = false;
    renderActions(STATE.chapters.length - 1);
    renderSidebar();

  }catch(err){
    busy = false;
    STATE.chapters.pop();
    renderSidebar();
    if(STATE.chapters.length){
      renderView(STATE.chapters.length - 1);
    } else {
      showSetup();
    }
    const box2 = $('#actionsInner');
    const errDiv = document.createElement('div');
    errDiv.className = 'err';
    errDiv.textContent = '生成失败：' + err.message;
    box2.prepend(errDiv);
  }
}

/* ────────── 按钮 ────────── */
$('#btnSetup').onclick = ()=>{
  if(busy) return toast('正在生成中');
  showSetup();
};
$('#btnSaveSetup').onclick = saveSetup;

$('#btnReset').onclick = async ()=>{
  if(busy) return toast('正在生成中');
  if(!confirm('确定要清空所有章节，重新开始吗？')) return;
  await api('/api/reset', {});
  STATE.chapters = [];
  currentView = -1;
  renderAll();
  toast('已重置');
};

$('#btnExport').onclick = ()=>{
  if(!STATE.chapters.length) return toast('还没有章节');
  let md = '# 月与雨 · 澜洲纪行\n\n';
  STATE.chapters.forEach(ch=>{
    md += `## ${ch.title}\n\n`;
    if(ch.choice) md += `> 选择：${ch.choice}\n\n`;
    md += (ch.content || '') + '\n\n---\n\n';
  });
  const blob = new Blob([md], {type:'text/markdown;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '月与雨.md';
  a.click();
  URL.revokeObjectURL(a.href);
  toast('已导出');
};

$('#btnImport').onclick = ()=> $('#fileImport').click();
$('#fileImport').onchange = e=>{
  const f = e.target.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const data = JSON.parse(r.result);
      const p = data.preset || data;
      if(p.world !== undefined)     $('#psWorld').value = p.world;
      if(p.protagonist !== undefined) $('#psProt').value = p.protagonist;
      if(p.team !== undefined)      $('#psTeam').value = p.team;
      if(p.outline !== undefined)   $('#psOutline').value = p.outline;
      if(p.rules !== undefined)     $('#psRules').value = p.rules;
      if(p.style !== undefined)     $('#psStyle').value = p.style;
      if(p.opening !== undefined)   $('#psOpening').value = p.opening;
      toast('预设已导入，记得点保存');
    }catch(err){
      toast('导入失败：不是有效的 JSON');
    }
  };
  r.readAsText(f);
  e.target.value = '';
};

/* ────────── 启动 ────────── */
loadState().catch(e=>{
  document.body.innerHTML = '<div style="padding:40px;color:#f7768e">无法连接到本地服务：' + e.message + '</div>';
});
</script>
</body>
</html>
